<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión · Control de Asistencia COPASA</title>
<link rel="icon" href="img/logo.png" />

<!-- Tarjeta al compartir el enlace (Facebook, WhatsApp, etc.) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="COPASA" />
<meta property="og:title" content="COPASA · Control de Asistencia" />
<meta name="description" content="Sistema de control de asistencia y control de horas del personal de bodega COPASA." />
<meta property="og:description" content="Sistema de control de asistencia y control de horas del personal de bodega COPASA." />
<meta property="og:image" content="https://harinrc.github.io/copasa-asistencia/img/logo-share.jpg" />
<meta property="og:url" content="https://harinrc.github.io/copasa-asistencia/login.html" />

<!-- Tarjeta al compartir el enlace (Twitter/X) -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="COPASA · Control de Asistencia" />
<meta name="twitter:description" content="Sistema de control de asistencia y control de horas del personal de bodega COPASA." />
<meta name="twitter:image" content="https://harinrc.github.io/copasa-asistencia/img/logo-share.jpg" />

<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="img/icon-192.png" />
<meta name="theme-color" content="#d62839" />

<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-body">
  <div class="auth-slideshow" id="slideshow"></div>
  <div class="auth-overlay"></div>

  <div class="auth-card">
    <div class="auth-logo">
      <img src="img/logo.png" alt="COPASA" class="auth-logo-img" />
      <p>Control de Asistencia · Bodega</p>
    </div>

    <form id="login-form" class="auth-form">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" required placeholder="usuario@copasa.com" autocomplete="username" />

      <label for="password">Contraseña</label>
      <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />

      <button type="submit" id="login-btn">Ingresar</button>
      <p id="auth-error" class="auth-error" hidden></p>
    </form>

    <button id="forgot-btn" class="link-btn">¿Olvidaste tu contraseña?</button>
    <p class="auth-hint">Acceso solo para personal autorizado por administración.</p>
  </div>

  <!-- Firebase SDKs (versión modular vía CDN) -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
  <script type="module" src="js/login-slideshow.js"></script>
</body>
</html>
